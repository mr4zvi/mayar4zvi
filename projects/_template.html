<!doctype html>
<!--
  Project page template. To add a project:
    1. Add an entry to `projects` in assets/js/data.js (pick a slug).
    2. Copy this file to projects/<slug>.html and set data-project="<slug>".
    3. Replace the placeholder content below.
  Title, year, tags and prev/next links are filled in from data.js.
  (Files starting with "_" are not published by GitHub Pages.)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ — Portfolio</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-project="__SLUG__">
  <div class="layout">
    <main class="content">
      <header class="project-header">
        <h1 data-fill="title">__TITLE__</h1>
        <div class="project-meta">
          <span data-fill="year"></span>
          <span data-fill="tags"></span>
        </div>
      </header>

      <!-- Swap for <img class="hero" src="../assets/img/__SLUG__/hero.jpg" alt=""> -->
      <div class="hero"></div>

      <div class="prose">
        <p>One-paragraph summary of the project: what it is, why it exists, and your role.</p>
        <h2>Process</h2>
        <p>Describe how it came together.</p>
      </div>

      <div class="gallery">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="prose">
        <h2>Outcome</h2>
        <p>What happened, what you learned, links to the live thing.</p>
      </div>

      <nav class="pager" id="project-pager" aria-label="Projects"></nav>
    </main>
    <aside class="sidebar" id="sidebar"></aside>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
